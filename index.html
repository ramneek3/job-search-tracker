<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pipeline — track every internship application from wishlist to offer."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>Pipeline — Job Search Tracker</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      try {
        const t = JSON.parse(localStorage.getItem('pipeline:ui') || '{}').state?.theme ?? 'system'
        const dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
